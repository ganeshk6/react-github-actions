name: "First Workflow"
on: 
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa

jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Nodejs in VM
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESList in app
        run: npm run lint

      - name: Make react build
        run: npm run build

      - name: Download artifact build folder
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist/
          retention-days: 7